# Stock display of the Anycubic Kobra Neo (ST7789V TFT, 320x240) as a Klipper
# screen: status page, menus and the rotary knob.
# Knob: turn = move/change, press = enter/accept, hold ~1 s = back/undo,
# hold 2 s = confirm dangerous actions (e.g. cancel print).
# REQUIRES the patched MCU firmware (see README.md) and Klipper >= v0.13.0-800.
# Pins taken from Anycubic's firmware (bsp_spi_tft.h / pins_ANYCUBIC_KOBRA_NEO.h).
[kobra_tft]
cs_pin: PB1
dc_pin: PB0
backlight_pin: PC0
spi_bus: spi2_PC5_PC4          # hardware SPI2 (SCK PC5, MOSI PC4)
spi_speed: 24000000            # gives PCLK1/4 = 21 MHz (Anycubic used 42 MHz)
# Software SPI fallback if hardware SPI gives trouble: comment out spi_bus and use
#spi_software_sclk_pin: PC5
#spi_software_mosi_pin: PC4
#spi_software_miso_pin: PA10   # not used; PA10 is the board's SD card detect
#spi_speed: 4000000
encoder_pins: ^PB10, ^PB3
click_pin: ^!PB4
#encoder_steps_per_detent: 4   # 2 or 4; if the knob jumps two steps at a time, try 2
#idioma: en                    # default language when none was chosen in the menu: en / es
#refresco: 2                   # seconds between status updates
#bytes_imprimiendo: 1500       # max data per cycle while printing (keeps USB free)
#bytes_reposo: 4000
#bytes_usando: 8000            # data per cycle while the knob is in use (fast response)
#apagar_luz_tras: 900          # seconds without printing before the backlight turns off (0 = never)
#animacion_inicio: True        # boot animation (~7 s)
#volver_al_estado_tras: 60     # seconds untouched in a menu before returning to status (0 = never)
#gamma: anycubic               # panel gamma curve: anycubic / estandar / viva
#moonraker_url: http://127.0.0.1:7125   # used for Fluidd-like progress and G-code thumbnails
